services:
  bazarr:
    image: 'lscr.io/linuxserver/bazarr:1.5.6'
    volumes:
      - '/etc/localtime:/etc/localtime:ro'
      - '${APP_DATA_DIR}/data:/config'
      - '${ROOT_FOLDER_HOST}/media:/media'
    environment:
      - 'PUID=1000'
      - 'PGID=1000'
      - 'TZ=${TZ}'
    ports:
      - ${APP_PORT}:6767
