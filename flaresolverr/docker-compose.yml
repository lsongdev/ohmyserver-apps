services:
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    restart: unless-stopped
    ports:
      - ${APP_PORT}:8191
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL-info}
      - TZ=${TZ}
    networks:
      - default_network
    labels:
      traefik.enable: false
      runtipi.managed: true

networks:
  default_network:
    driver: bridge
